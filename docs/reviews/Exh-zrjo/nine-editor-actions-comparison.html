<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>
body{font:14px/1.5 var(--font-sans);color:var(--foreground)}p{margin:0 0 12px;color:var(--muted-foreground)}nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}button,select{font:inherit;background:var(--secondary);color:var(--secondary-foreground);border:1px solid var(--border);border-radius:8px;padding:8px 12px;cursor:pointer}button[aria-pressed=true]{background:var(--primary);color:var(--primary-foreground)}.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}figure{margin:0;min-width:0}figcaption{font-weight:600;margin-bottom:8px}.viewport{overflow:hidden;width:100%;border-radius:8px}.shot{transform-origin:top left;background-repeat:no-repeat}small{display:block;color:var(--muted-foreground);margin-top:12px}
</style></head><body><p id="explanation"></p><nav aria-label="Screenshot controls"><select aria-label="Surface"><option value="desktop">Desktop actions</option><option value="phone">Phone actions</option></select><button data-mode="dark" aria-pressed="true">Dark</button><button data-mode="light" aria-pressed="false">Light</button></nav><div class="pair"><figure><figcaption>Before</figcaption><div class="viewport"><div class="shot" id="before" role="img" aria-label="Actual interface before"></div></div></figure><figure><figcaption>After</figcaption><div class="viewport"><div class="shot" id="after" role="img" aria-label="Actual interface after"></div></div></figure></div><small>Actual light/dark screenshots at the same action-area scroll position. Desktop details and full 320px phone views. Council review continues.</small><script>
const shots={"dark": {"desktop": ["/home/maxomdal/.t3/worktrees/Exhibit/feature-Exh-zrjo-ui-council/docs/screenshots/Exh-zrjo/nine-r23-before/state-actions-1280-dark.png", "/home/maxomdal/.t3/worktrees/Exhibit/feature-Exh-zrjo-ui-council/docs/screenshots/Exh-zrjo/nine-r23-details/state-actions-1280-dark.png"], "phone": ["/home/maxomdal/.t3/worktrees/Exhibit/feature-Exh-zrjo-ui-council/docs/screenshots/Exh-zrjo/nine-r23-before/state-actions-320-dark.png", "/home/maxomdal/.t3/worktrees/Exhibit/feature-Exh-zrjo-ui-council/docs/screenshots/Exh-zrjo/nine-r23-details/state-actions-320-dark.png"]}, "light": {"desktop": ["/home/maxomdal/.t3/worktrees/Exhibit/feature-Exh-zrjo-ui-council/docs/screenshots/Exh-zrjo/nine-r23-before/state-actions-1280-light.png", "/home/maxomdal/.t3/worktrees/Exhibit/feature-Exh-zrjo-ui-council/docs/screenshots/Exh-zrjo/nine-r23-details/state-actions-1280-light.png"], "phone": ["/home/maxomdal/.t3/worktrees/Exhibit/feature-Exh-zrjo-ui-council/docs/screenshots/Exh-zrjo/nine-r23-before/state-actions-320-light.png", "/home/maxomdal/.t3/worktrees/Exhibit/feature-Exh-zrjo-ui-council/docs/screenshots/Exh-zrjo/nine-r23-details/state-actions-320-light.png"]}};let mode='dark';const select=document.querySelector('select');
function draw(){const kind=select.value;const dims=kind==='desktop'?[840,290]:[320,844];document.querySelector('.pair').style.gridTemplateColumns=kind==='desktop'?'minmax(0,1fr)':'repeat(2,minmax(0,1fr))';document.getElementById('explanation').textContent=kind==='desktop'?'Save leads the task. Transfer notes sit with their actions, and Erase uses the shared quiet outline.':'Phone panel actions now use 44px targets, with each transfer explanation kept beside its action.';document.querySelectorAll('.shot').forEach((e,i)=>{e.style.width=dims[0]+'px';e.style.height=dims[1]+'px';e.style.backgroundImage='url("'+shots[mode][kind][i]+'")';e.style.backgroundSize=kind==='desktop'?'1280px 800px':'320px 844px';e.style.backgroundPosition=kind==='desktop'?'-222px -72px':'0 0'});document.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===mode)));size()}
function size(){document.querySelectorAll('.viewport').forEach(p=>{const e=p.firstElementChild;const scale=p.clientWidth/parseFloat(e.style.width);p.style.height=(parseFloat(e.style.height)*scale)+'px';e.style.transform='scale('+scale+')'})}document.querySelectorAll('button').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;draw()});select.onchange=draw;new ResizeObserver(size).observe(document.body);draw();
</script></body></html>
