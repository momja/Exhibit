<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font:14px/1.5 var(--font-sans);color:var(--foreground)}p{margin:0 0 12px;color:var(--muted-foreground)}nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}button,select{font:inherit;background:var(--secondary);color:var(--secondary-foreground);border:1px solid var(--border);border-radius:8px;padding:8px 12px;cursor:pointer}button[aria-pressed=true]{background:var(--primary);color:var(--primary-foreground)}.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}figure{margin:0;min-width:0}figcaption{font-weight:600;margin-bottom:8px}img{display:block;width:100%;height:auto;border-radius:8px}small{display:block;color:var(--muted-foreground);margin-top:12px}</style></head><body><p id="note"></p><nav aria-label="Screenshot controls"><select aria-label="Empty destination"><option value="search">Empty Search</option><option value="starred">Empty Starred</option></select><button data-mode="dark" aria-pressed="true">Dark</button><button data-mode="light" aria-pressed="false">Light</button></nav><div class="pair"><figure><figcaption>Before repair</figcaption><img alt="Actual empty destination before repair"></figure><figure><figcaption>After repair</figcaption><img alt="Actual empty destination after repair"></figure></div><small>Actual320px captures from a separate empty test account, with real color-scheme emulation. Artifact data is untouched.</small><script>const shots={"dark": {"search": ["/home/maxomdal/.t3/worktrees/Exhibit/feature-Exh-zrjo-ui-council/docs/screenshots/Exh-zrjo/stack-empty-states/before-search-320-dark.png", "/home/maxomdal/.t3/worktrees/Exhibit/feature-Exh-zrjo-ui-council/docs/screenshots/Exh-zrjo/stack-empty-states/after-search-320-dark.png"], "starred": ["/home/maxomdal/.t3/worktrees/Exhibit/feature-Exh-zrjo-ui-council/docs/screenshots/Exh-zrjo/stack-empty-states/before-starred-320-dark.png", "/home/maxomdal/.t3/worktrees/Exhibit/feature-Exh-zrjo-ui-council/docs/screenshots/Exh-zrjo/stack-empty-states/after-starred-320-dark.png"]}, "light": {"search": ["/home/maxomdal/.t3/worktrees/Exhibit/feature-Exh-zrjo-ui-council/docs/screenshots/Exh-zrjo/stack-empty-states/before-search-320-light.png", "/home/maxomdal/.t3/worktrees/Exhibit/feature-Exh-zrjo-ui-council/docs/screenshots/Exh-zrjo/stack-empty-states/after-search-320-light.png"], "starred": ["/home/maxomdal/.t3/worktrees/Exhibit/feature-Exh-zrjo-ui-council/docs/screenshots/Exh-zrjo/stack-empty-states/before-starred-320-light.png", "/home/maxomdal/.t3/worktrees/Exhibit/feature-Exh-zrjo-ui-council/docs/screenshots/Exh-zrjo/stack-empty-states/after-starred-320-light.png"]}};let mode='dark';const select=document.querySelector('select');function draw(){const screen=select.value;document.querySelector('#note').textContent=screen==='search'?'Empty Search again offers creation, preserving PR #273’s welcome screen.':'Empty Starred now explains starring and leads to Search.';document.querySelectorAll('img').forEach((img,i)=>img.src=shots[mode][screen][i]);document.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===mode)))}document.querySelectorAll('button').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;draw()});select.onchange=draw;draw();</script></body></html>
