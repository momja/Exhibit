<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font:14px/1.5 var(--font-sans);color:var(--foreground)}p{margin:0 0 12px;color:var(--muted-foreground)}nav{display:flex;gap:8px;margin-bottom:12px}button{font:inherit;cursor:pointer;background:var(--secondary);color:var(--secondary-foreground);border:1px solid var(--border);border-radius:8px;padding:8px 16px}button[aria-pressed=true]{background:var(--primary);color:var(--primary-foreground)}figure{margin:0 0 16px;min-width:0}figcaption{font-weight:600;margin-bottom:8px}.viewport{overflow:hidden;width:100%;border-radius:8px}.detail{width:812px;height:160px;background-size:1280px 800px;background-position:-234px -630px;transform-origin:top left}small{display:block;color:var(--muted-foreground);margin-top:10px}</style></head><body><p>Versions now shares column widths: timestamps and actions align across adjacent rows.</p><nav aria-label="Screenshot scheme"><button data-mode="dark" aria-pressed="true">Dark</button><button data-mode="light" aria-pressed="false">Light</button></nav><figure><figcaption>Before · staggered timestamps</figcaption><div class="viewport"><div class="detail" id="before" role="img" aria-label="Before: history timestamps shift between rows"></div></div></figure><figure><figcaption>After · aligned columns</figcaption><div class="viewport"><div class="detail" id="after" role="img" aria-label="After: history timestamps align"></div></div></figure><small>Details from actual1280px app screenshots · real light/dark. The9/10 council loop continues.</small><script>const shots={"light":["/home/maxomdal/.t3/worktrees/Exhibit/feature-Exh-zrjo-ui-council/docs/screenshots/Exh-zrjo/nine-round-19/history-1280-light.png","/home/maxomdal/.t3/worktrees/Exhibit/feature-Exh-zrjo-ui-council/docs/screenshots/Exh-zrjo/nine-history-after/history-1280-light.png"],"dark":["/home/maxomdal/.t3/worktrees/Exhibit/feature-Exh-zrjo-ui-council/docs/screenshots/Exh-zrjo/nine-round-19/history-1280-dark.png","/home/maxomdal/.t3/worktrees/Exhibit/feature-Exh-zrjo-ui-council/docs/screenshots/Exh-zrjo/nine-history-after/history-1280-dark.png"]};function draw(mode){document.getElementById('before').style.backgroundImage='url("'+shots[mode][0]+'")';document.getElementById('after').style.backgroundImage='url("'+shots[mode][1]+'")';document.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===mode)))}function size(){document.querySelectorAll('.viewport').forEach(p=>{const scale=p.clientWidth/812;p.style.height=(160*scale)+'px';p.firstElementChild.style.transform='scale('+scale+')'})}document.querySelectorAll('button').forEach(b=>b.onclick=()=>draw(b.dataset.mode));new ResizeObserver(size).observe(document.body);draw('dark');size();</script></body></html>
