<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:transparent;color:var(--foreground);font:14px/1.5 var(--font-sans,system-ui)}
nav{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}button{font:inherit;color:var(--foreground);background:var(--secondary);border:1px solid var(--border);border-radius:8px;padding:7px 11px;min-height:38px;cursor:pointer}button[aria-pressed=true]{background:var(--accent-surface);color:var(--accent-surface-foreground);border-color:var(--ring)}button:focus-visible{outline:2px solid var(--ring);outline-offset:2px}.theme{margin-left:auto}
p{margin:0 0 12px;color:var(--muted-foreground)}.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}.label{font-weight:600;margin-bottom:6px}.image{display:block;width:100%;padding:0;overflow:hidden;border-radius:9px;border:1px solid var(--border);background:transparent}.image img{display:block;width:100%;height:auto}.hint{font-size:12px;margin-top:8px}dialog{max-width:min(90vw,1100px);max-height:88vh;padding:14px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--foreground)}dialog img{display:block;max-width:100%;height:auto}dialog button{position:sticky;top:0;display:block;margin-left:auto}dialog::backdrop{background:#0009}
@media(max-width:420px){nav{gap:5px}button{font-size:12px;padding:6px 8px}.pair{gap:8px}}
</style></head><body><nav aria-label="Comparison"><span id="tabs"></span><button id="theme" class="theme">Dark</button></nav><p id="caption"></p><div class="pair"><div><div class="label">Before</div><button class="image" id="old" aria-label="Enlarge before screenshot"><img id="oldImg" alt=""></button></div><div><div class="label">After</div><button class="image" id="new" aria-label="Enlarge after screenshot"><img id="newImg" alt=""></button></div></div><p class="hint">Actual browser captures · tap a screenshot to enlarge</p><dialog id="zoom"><button id="close">Close</button><img id="zoomImg" alt=""></dialog><script>
const screens=[{"name":"Find","caption":"Native find controls were tiny. Fields, buttons and options now follow the app’s type, color and 44px phone targets.","light":{"before":"../../screenshots/Exh-zrjo/editor-chrome-before/source-find-390-light.png","after":"../../screenshots/Exh-zrjo/visual-round-15/source-find-390-light.png"},"dark":{"before":"../../screenshots/Exh-zrjo/editor-chrome-before/source-find-390-dark.png","after":"../../screenshots/Exh-zrjo/visual-round-15/source-find-390-dark.png"}},{"name":"Word matches","caption":"Secondary word matches now use a faint blue tint so the actual selected word leads.","light":{"before":"../../screenshots/Exh-zrjo/editor-chrome-before/source-occurrences-390-light.png","after":"../../screenshots/Exh-zrjo/visual-round-15/source-occurrences-390-light.png"},"dark":{"before":"../../screenshots/Exh-zrjo/editor-chrome-before/source-occurrences-390-dark.png","after":"../../screenshots/Exh-zrjo/visual-round-15/source-occurrences-390-dark.png"}},{"name":"Gallery","caption":"Quieter borders and default tiles make the cards and navigation feel more coherent in dark mode.","light":{"before":"../../screenshots/Exh-zrjo/rebased-before/gallery-1280-light.png","after":"../../screenshots/Exh-zrjo/visual-round-15/gallery-1280-light.png"},"dark":{"before":"../../screenshots/Exh-zrjo/rebased-before/gallery-1280-dark.png","after":"../../screenshots/Exh-zrjo/visual-round-15/gallery-1280-dark.png"}},{"name":"Sharing","caption":"Phone sharing choices stack cleanly; URL and Copy align, with helper text below its action.","light":{"before":"../../screenshots/Exh-zrjo/rebased-before/share-390-light.png","after":"../../screenshots/Exh-zrjo/visual-round-15/share-390-light.png"},"dark":{"before":"../../screenshots/Exh-zrjo/rebased-before/share-390-dark.png","after":"../../screenshots/Exh-zrjo/visual-round-15/share-390-dark.png"}}];let selected=0,mode='dark';
const tabs=document.querySelector('#tabs');tabs.style.display='contents';
screens.forEach((s,i)=>{const b=document.createElement('button');b.textContent=s.name;b.onclick=()=>{selected=i;paint()};tabs.append(b)});
function paint(){const s=screens[selected];[...tabs.children].forEach((b,i)=>b.setAttribute('aria-pressed',i===selected));document.querySelector('#theme').textContent=mode==='dark'?'Dark · switch to light':'Light · switch to dark';document.querySelector('#caption').textContent=s.caption;['old','new'].forEach((id,i)=>{const img=document.querySelector('#'+id+'Img');img.src=s[mode][i?'after':'before'];img.alt=s.name+' '+(i?'after':'before')+' in '+mode+' mode';});}
document.querySelector('#theme').onclick=()=>{mode=mode==='dark'?'light':'dark';paint()};
['old','new'].forEach(id=>document.querySelector('#'+id).onclick=()=>{document.querySelector('#zoomImg').src=document.querySelector('#'+id+'Img').src;document.querySelector('#zoom').showModal()});
document.querySelector('#close').onclick=()=>document.querySelector('#zoom').close();paint();
</script></body></html>
