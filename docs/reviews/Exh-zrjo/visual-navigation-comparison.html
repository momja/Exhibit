<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:transparent;font:14px/1.5 var(--font-sans,system-ui);color:var(--foreground)}nav{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 10px}button{font:inherit;border:1px solid var(--border);background:var(--secondary);color:var(--foreground);padding:7px 11px;min-height:38px;border-radius:8px;cursor:pointer}button[aria-pressed=true]{background:var(--accent-surface);color:var(--accent-surface-foreground);border-color:var(--ring)}button:focus-visible{outline:2px solid var(--ring);outline-offset:2px}#full{margin-left:auto}p{margin:0 0 12px;color:var(--muted-foreground)}.pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}.pair section{min-width:0}.shot{box-sizing:border-box}h3{font-size:14px;margin:0 0 6px}.shot{display:block;padding:0;border-radius:9px;overflow:hidden;width:100%;text-align:left;border:1px solid var(--border)}img{display:block;width:100%;height:auto}.crop .shot{height:250px}.crop img{width:1280px;max-width:none}.note{font-size:12px;margin-top:7px}dialog{border:1px solid var(--border);background:var(--card);color:var(--foreground);border-radius:12px;padding:14px;max-width:min(92vw,1100px);max-height:88vh}dialog button{display:block;margin-left:auto;margin-bottom:10px}dialog::backdrop{background:#0009}@media(max-width:520px){.pair{grid-template-columns:1fr}}
</style></head><body><nav aria-label="Screenshot appearance"><button id="light">Light</button><button id="dark">Dark</button><button id="full" aria-pressed="false">Full page</button></nav><p>Desktop navigation keeps its position when “Shared with me” becomes active.</p><div class="pair crop"><section><h3>Before · label wraps</h3><button class="shot" data-side="before" aria-label="Enlarge before screenshot"><img id="before" alt=""></button><p class="note">Active row: 53.3px · next destination shifts 9.3px</p></section><section><h3>After · full label fits</h3><button class="shot" data-side="after" aria-label="Enlarge after screenshot"><img id="after" alt=""></button><p class="note">All rows: 44px · stable positions</p></section></div><p class="note">Actual 1280px browser captures · navigation detail</p><dialog><button id="close">Close</button><img id="zoom" alt=""></dialog><script>
const shots={"light":{"before":"../../screenshots/Exh-zrjo/visual-round-13/shared-1280-light.png","after":"../../screenshots/Exh-zrjo/visual-round-15/shared-1280-light.png"},"dark":{"before":"../../screenshots/Exh-zrjo/visual-round-13/shared-1280-dark.png","after":"../../screenshots/Exh-zrjo/visual-round-15/shared-1280-dark.png"}};let mode='dark';
function paint(){for(const side of ['before','after']){const img=document.querySelector('#'+side);img.src=shots[mode][side];img.alt='Shared with me, '+side+' in '+mode+' mode'}for(const theme of ['light','dark'])document.querySelector('#'+theme).setAttribute('aria-pressed',theme===mode)}
for(const theme of ['light','dark'])document.querySelector('#'+theme).onclick=()=>{mode=theme;paint()};
document.querySelector('#full').onclick=()=>{const crop=document.querySelector('.pair').classList.toggle('crop');document.querySelector('#full').setAttribute('aria-pressed',!crop)};
for(const button of document.querySelectorAll('.shot'))button.onclick=()=>{const img=document.querySelector('#'+button.dataset.side);document.querySelector('#zoom').src=img.src;document.querySelector('#zoom').alt=img.alt;document.querySelector('dialog').showModal()};
document.querySelector('#close').onclick=()=>document.querySelector('dialog').close();paint();
</script></body></html>
