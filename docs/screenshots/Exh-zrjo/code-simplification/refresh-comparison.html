<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;background:transparent;color:var(--foreground,#18202c);font:14px/1.5 var(--font-sans,system-ui)}.note{margin:0 0 12px;color:var(--muted-foreground,#647085);font-size:13px}.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}figure{margin:0;min-width:0}figcaption{font-weight:600;margin:0 0 8px}img{display:block;width:100%;height:340px;object-fit:cover;object-position:center;border:1px solid var(--border,#d6dce6);border-radius:10px;box-sizing:border-box}.footer{margin:12px 0 0;color:var(--muted-foreground,#647085);font-size:13px}@media(max-width:500px){.pair{grid-template-columns:1fr}img{height:300px}}</style></head><body><p class="note">Dark mode · 390px phone · Simulated offline refresh</p><div class="pair"><figure><figcaption>Before · Unloaded error style</figcaption><img src="refresh-before.png" alt="Previous refresh notice uses unstyled body text close to the focused retry button"></figure><figure><figcaption>After · Shared Tags feedback</figcaption><img src="refresh-after.png" alt="Refresh error uses shared helper text, Tags error color and clear spacing before Retry"></figure></div><p class="footer">Retry refreshes the server partial. Tag controls unlock after it arrives.</p></body></html>
