services:
  app:
    build: .
    ports:
      - "8080:8080"
      - "8081:8081"
    volumes:
      - data:/data
    environment:
      - DATA_DIR=/data
      - ADDR=:8080
      - RENDER_ADDR=:8081
      - APP_ORIGIN=${APP_ORIGIN:-http://localhost:8080}
      - RENDER_ORIGIN=${RENDER_ORIGIN:-http://localhost:8081}
      - AUTH_TOKEN=${AUTH_TOKEN:-dev-token}
      # Agent settings, read from .env. Each one is optional: with none set the
      # agent runs on each user's own key (docs/deployment.md §4).
      # Platform mode (docs/deployment.md §4.1):
      - AGENT_API_KEY=${AGENT_API_KEY:-}
      - AGENT_PROVIDER=${AGENT_PROVIDER:-}
      - AGENT_MODEL=${AGENT_MODEL:-}
      # Spend caps (av-99f4): platform mode needs at least one of these set or
      # the server refuses to start. Empty means unset (no limit).
      - AGENT_SPEND_CAP_OWNER_CENTS=${AGENT_SPEND_CAP_OWNER_CENTS:-}
      - AGENT_SPEND_CAP_SESSION_CENTS=${AGENT_SPEND_CAP_SESSION_CENTS:-}
      - AGENT_SPEND_CAP_INSTANCE_CENTS=${AGENT_SPEND_CAP_INSTANCE_CENTS:-}
      - AGENT_SPEND_CAP_TURN_SECONDS=${AGENT_SPEND_CAP_TURN_SECONDS:-}
      # Usage-policy guardrail, all three or none (§4.2):
      - GUARDRAIL_PROVIDER=${GUARDRAIL_PROVIDER:-}
      - GUARDRAIL_MODEL=${GUARDRAIL_MODEL:-}
      - GUARDRAIL_API_KEY=${GUARDRAIL_API_KEY:-}
      # Artifact bodies go to DATA_DIR/blobs unless a bucket is named (av-52ll).
      # To keep them in the MinIO below instead: bring MinIO up FIRST and create
      # the bucket, then uncomment these and start the app. The app verifies the
      # bucket at startup and exits if it cannot reach it, so starting both at
      # once races MinIO's boot and the app loses. MinIO is also behind a
      # profile, so plain `docker compose up` does not start it at all:
      #
      #   docker compose --profile replication-local up -d minio
      #   docker run --rm --network=<this>_default minio/mc \
      #     mb --ignore-existing http://minioadmin:minioadmin@minio:9000/exhibit
      #   docker compose up -d app
      #
      # See docs/deployment.md §7 — and note Litestream backs up the database
      # only, so the bucket (or DATA_DIR/blobs) still needs its own backup.
      # - BLOB_S3_BUCKET=exhibit
      # - BLOB_S3_ENDPOINT=http://minio:9000
      # - BLOB_S3_ACCESS_KEY_ID=${MINIO_ROOT_USER:-minioadmin}
      # - BLOB_S3_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}

  litestream:
    image: litestream/litestream
    profiles: ["replication"]
    volumes:
      - data:/data
      - ./litestream.yml:/etc/litestream.yml
    environment:
      - LITESTREAM_ACCESS_KEY_ID
      - LITESTREAM_SECRET_ACCESS_KEY
      - LITESTREAM_BUCKET_URL
    command: replicate -exec "/server"
    depends_on:
      - app

  minio:
    image: minio/minio
    profiles: ["replication-local"]
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio:/data
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"

volumes:
  data: {}
  minio: {}
